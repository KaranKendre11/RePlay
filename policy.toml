# Guardrails for the automation.
#
# Every list below permits nothing when it is empty or absent. The failure
# mode of a missing or malformed policy should be a refusal, never free rein.

[allowlist]
# Hosts the automation may navigate to. Glob patterns against host:port.
domains = ["127.0.0.1:8080", "127.0.0.1:8081", "localhost:8080", "localhost:8081"]

# Paths it may reach within those hosts. Tenants mount the same vendor product
# at different points — Northgate serves it under /tlr — so each mount point is
# listed explicitly rather than widening this to "/*". A capability reaching a
# path nobody allowlisted is the signal worth keeping.
routes = [
  "/", "/search", "/nav", "/member/*", "/member", "/reset",
  "/tlr", "/tlr/", "/tlr/search", "/tlr/nav", "/tlr/member", "/tlr/member/*", "/tlr/reset",
]

# Deny beats allow. These exist because a broader rule above was too generous.
denied_routes = ["/admin/*", "/transfer/*", "/wire/*"]

# Action types permitted at all. Anything absent here is refused at the point
# of action, regardless of what an artifact asks for.
actions = [
  "click", "type", "select", "navigate", "press", "read", "wait",
  "accept_dialog", "dismiss_dialog",
]

# How much damage a run may do at all. `safe` reads; `risky` changes state;
# `irreversible` moves money or notifies someone outside the institution.
#
# A ceiling, not a request field. On the command line `--allow-risky` is a
# person at a terminal taking responsibility; over HTTP the same two booleans
# were request body, which handed the decision to whoever wrote the calling
# code. It belongs here, where raising it is one reviewable line in a diff.
[risk]
ceiling = "safe"
